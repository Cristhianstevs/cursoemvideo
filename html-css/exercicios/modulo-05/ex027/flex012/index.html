<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      .container {
        background-color: lightsalmon;
        display: flex;
        flex-flow: row nowrap;
      }
      .item {
        background-color: lightskyblue;
        border: 1px solid black;
        text-align: center;
      }
      #cxA {
        /* flex-shrink: 0;
        flex-grow: 2;
        flex-basis: 250px; */

        flex: 2 0 250px;
      }
      #cxB {
        /* flex-shrink: 1;
        flex-grow: 1;
        flex-basis: 150px; */

        flex: 1 1 150px;
      }
      #cxC {
        /* flex-shrink: 2;
        flex-grow: 0;
        flex-basis: auto; */

        flex: 1 0 150px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item" id="cxA">A</div>
      <div class="item" id="cxB">B</div>
      <div class="item" id="cxC">C</div>
    </div>
  </body>
</html>
