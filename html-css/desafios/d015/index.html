<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio Site Grid</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      .content {
        height: 100vh;
        display: grid;
        grid-template: 80px 40px 1fr 40px / 1fr 130px;
        gap: 10px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      .grid-item {
        background-color: goldenrod;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        color: blue;
      }
      .topo {
        grid-area: 1 / 1 / 2 / -1;
      }
      .menu {
        grid-area: 2 / 1 / span 1 / -1;
      }
      .principal {
        grid-area: 3 / 1 / span 1 / span 1;
      }
      .secundario {
        grid-area: 3 / 2 / -2 / -1;
      }
      .rodape {
        grid-area: -2 / 1 / -1 / -1;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="topo grid-item">Topo</div>
      <div class="menu grid-item">Menu</div>
      <div class="principal grid-item">Principal</div>
      <div class="secundario grid-item">Secundario</div>
      <div class="rodape grid-item">Rodape</div>
    </div>
  </body>
</html>
